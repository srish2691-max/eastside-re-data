name: Update Eastside MLS Data
on:
  schedule:
    - cron: '0 14 * * 1' # Runs every Monday at 7 AM PDT
  workflow_dispatch:     # Allows manual trigger button in GitHub UI

permissions:
  contents: write        # REQUIRED: Gives the bot permission to push the JSON back to your repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas requests

      - name: Fetch and Filter Data (Ultra Fast)
        run: |
          echo "Downloading Redfin dataset..."
          curl -sSL https://redfin-public-data.s3.us-west-2.amazonaws.com/redfin_market_tracker/zip_code_market_tracker.tsv000.gz -o raw.tsv.gz

          echo "Filtering down to Eastside ZIP codes..."
          # NR==1 GUARANTEES the header row is captured; the regex captures our 7 ZIP codes in a single pass
          zcat raw.tsv.gz | awk 'NR==1 || /98028|98072|98012|98034|98033|98052|98021/' > filtered.tsv || true
          
          rm raw.tsv.gz
          echo "✅ Filtered successfully! Total matching rows captured:"
          wc -l filtered.tsv

      - name: Generate JSON
        run: |
          python - << 'EOF'
          import pandas as pd
          import json, datetime, sys

          try:
              df = pd.read_csv('filtered.tsv', sep='\t', low_memory=False, on_bad_lines='skip')
              if df.empty:
                  print("❌ Error: filtered.tsv is empty.")
                  sys.exit(1)

              print("ℹ️ Found file headers:", df.columns.tolist()[:8])

              # 1. Dynamically find the Region/ZIP column
              possible_zip_cols = ['region', 'region_name', 'Region', 'Region Name', 'zip_code', 'Zip Code']
              col_name = next((col for col in possible_zip_cols if col in df.columns), None)
              if not col_name:
                  for c in df.columns:
                      if 'region' in str(c).lower() or 'zip' in str(c).lower():
                          col_name = c
                          break
              if not col_name:
                  raise KeyError(f"Could not locate region column in headers: {df.columns.tolist()}")

              df['clean_zip'] = df[col_name].astype(str).apply(lambda x: x.split(':')[-1].strip())

              # 2. Filter strictly for target ZIP codes and Residential properties
              target_zips = ['98028', '98072', '98012', '98034', '98033', '98052', '98021']
              eastside = df[df['clean_zip'].isin(target_zips)].copy()

              if 'property_type' in eastside.columns:
                  prop_filter = eastside['property_type'].isin(['Single Family Residential', 'All Residential', 'All Home Types'])
                  if prop_filter.any():
                      eastside = eastside[prop_filter]

              # 3. Dynamically find date, price, and ppsf columns
              date_col = next((c for c in df.columns if 'period_end' in str(c).lower() or 'date' in str(c).lower()), 'period_end')
              price_col = next((c for c in df.columns if 'median_sale_price' in str(c).lower() or 'price' in str(c).lower()), 'median_sale_price')
              ppsf_col = next((c for c in df.columns if 'ppsf' in str(c).lower() or 'sqft' in str(c).lower()), 'median_ppsf')

              latest_date = eastside[date_col].max()
              current_data = eastside[eastside[date_col] == latest_date]

              output = { "last_updated": str(datetime.date.today()), "zips": {} }
              for _, row in current_data.iterrows():
                  zip_code = str(row['clean_zip'])
                  med_price = int(row[price_col]) if pd.notnull(row[price_col]) else 1400000
                  ppsqft = int(row[ppsf_col]) if pd.notnull(row[ppsf_col]) else 500

                  output["zips"][zip_code] = {
                      "medianPrice": med_price,
                      "avgPpsqft": ppsqft,
                      "marginalRate": int(ppsqft * 0.42)
                  }

              with open("eastside_markets.json", "w") as f:
                  json.dump(output, f, indent=2)
              print("✅ Generated eastside_markets.json successfully for zips:", list(output["zips"].keys()))

          except Exception as e:
              print(f"❌ Fatal Python Error: {e}")
              sys.exit(1)
          EOF

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'bot@github.com'
          git add eastside_markets.json
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected in market data. Skipping push."
          else
            git commit -m "Auto-update Eastside MLS market data"
            git push
            echo "✅ Successfully pushed updated JSON to repository!"
          fi
