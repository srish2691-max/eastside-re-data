name: Update Eastside MLS Data
on:
  schedule:
    - cron: '0 14 * * 1' # Runs every Monday at 7 AM PDT
  workflow_dispatch:     # Allows manual trigger button in GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas requests

      - name: Fetch and Filter Data (Ultra Fast)
        run: |
          echo "Downloading Redfin dataset..."
          curl -sSL https://redfin-public-data.s3.us-west-2.amazonaws.com/redfin_market_tracker/zip_code_market_tracker.tsv000.gz -o raw.tsv.gz

          echo "Filtering down to Eastside ZIP codes..."
          # Single-pass stream: grabs column headers (period_end/region) AND target ZIPs without breaking the pipe
          zcat raw.tsv.gz | grep -E "(period_end|region|98028|98072|98012|98034|98033|98052|98021)" > filtered.tsv || true
          
          rm raw.tsv.gz
          echo "✅ Filtered successfully! Total matching rows captured:"
          wc -l filtered.tsv

      - name: Generate JSON
        run: |
          python - << 'EOF'
          import pandas as pd
          import json, datetime

          # Load the tiny, pre-filtered file (finishes in milliseconds)
          df = pd.read_csv('filtered.tsv', sep='\t', low_memory=False, on_bad_lines='skip')

          col_name = 'region' if 'region' in df.columns else 'region_name'
          df['clean_zip'] = df[col_name].astype(str).apply(lambda x: x.split(':')[-1].strip())

          target_zips = ['98028', '98072', '98012', '98034', '98033', '98052', '98021']
          eastside = df[df['clean_zip'].isin(target_zips)].copy()

          if 'property_type' in eastside.columns:
              prop_filter = eastside['property_type'].isin(['Single Family Residential', 'All Residential', 'All Home Types'])
              if prop_filter.any():
                  eastside = eastside[prop_filter]

          latest_date = eastside['period_end'].max()
          current_data = eastside[eastside['period_end'] == latest_date]

          output = { "last_updated": str(datetime.date.today()), "zips": {} }
          for _, row in current_data.iterrows():
              zip_code = str(row['clean_zip'])
              med_price = int(row['median_sale_price']) if pd.notnull(row['median_sale_price']) else 1400000
              ppsqft = int(row['median_ppsf']) if pd.notnull(row['median_ppsf']) else 500

              output["zips"][zip_code] = {
                  "medianPrice": med_price,
                  "avgPpsqft": ppsqft,
                  "marginalRate": int(ppsqft * 0.42)
              }

          with open("eastside_markets.json", "w") as f:
              json.dump(output, f, indent=2)
          print("✅ Generated eastside_markets.json instantly for zips:", list(output["zips"].keys()))
          EOF

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'bot@github.com'
          git add eastside_markets.json
          git commit -m "Auto-update Eastside MLS market data" || exit 0
          git push
