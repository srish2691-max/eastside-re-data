name: Update Eastside MLS Data
on:
  schedule:
    - cron: '0 14 * * 1' # Runs every Monday at 7 AM PDT
  workflow_dispatch:     # Allows manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas requests

      - name: Fetch and Filter Data (Puget Sound Region)
        run: |
          echo "Downloading Redfin dataset..."
          curl -sSL https://redfin-public-data.s3.us-west-2.amazonaws.com/redfin_market_tracker/zip_code_market_tracker.tsv000.gz -o raw.tsv.gz

          echo "Filtering for all King & Snohomish County ZIPs (980xx, 981xx, 982xx)..."
          # Captures header row OR any Washington State Puget Sound ZIP code
          zcat raw.tsv.gz | awk 'NR==1 || /980[0-9]{2}|981[0-9]{2}|982[0-9]{2}/' > filtered.tsv || true
          
          rm raw.tsv.gz
          echo "✅ Filtered successfully! Total regional rows captured:"
          wc -l filtered.tsv

      - name: Generate JSON
        run: |
          python - << 'EOF'
          import pandas as pd
          import json, datetime, sys

          try:
              df = pd.read_csv('filtered.tsv', sep='\t', low_memory=False, on_bad_lines='skip')
              if df.empty:
                  print("❌ Error: filtered.tsv is empty.")
                  sys.exit(1)

              # 1. Locate Region Column and Extract 5-Digit ZIPs
              col_name = None
              for c in df.columns:
                  if str(c).upper() in ['REGION', 'REGION_NAME', 'ZIP', 'ZIP_CODE', 'REGION_ID']:
                      col_name = c; break
              if not col_name:
                  for c in df.columns:
                      c_up = str(c).upper()
                      if ('REGION' in c_up or 'ZIP' in c_up) and ('TYPE' not in c_up and '_ID' not in c_up):
                          col_name = c; break

              df['clean_zip'] = df[col_name].astype(str).str.extract(r'(\d{5})')[0]
              
              # 2. Filter strictly for Washington State Puget Sound ZIPs (98000 to 98299)
              df = df[df['clean_zip'].dropna().str.match(r'^98[012]\d{2}$', na=False)].copy()

              # 3. Locate Property Type, Date, Price, and PPSF columns
              prop_col = next((c for c in df.columns if str(c).upper() in ['PROPERTY_TYPE', 'PROP_TYPE', 'HOME_TYPE']), None)
              date_col = next((c for c in df.columns if str(c).upper() in ['PERIOD_END', 'DATE', 'END_DATE']), 'PERIOD_END')
              price_col = next((c for c in df.columns if str(c).upper() in ['MEDIAN_SALE_PRICE', 'MEDIAN_PRICE', 'PRICE']), 'MEDIAN_SALE_PRICE')
              ppsf_col = next((c for c in df.columns if str(c).upper() in ['MEDIAN_PPSF', 'PPSF', 'PRICE_PER_SQFT']), 'MEDIAN_PPSF')

              output = { "last_updated": str(datetime.date.today()), "zips": {} }

              # 4. Process every unique Puget Sound ZIP code
              unique_zips = df['clean_zip'].unique()
              for zip_code in sorted(unique_zips):
                  zip_rows = df[df['clean_zip'] == zip_code].copy()
                  
                  # Prioritize Single Family Residential so condo prices do not drag down appraisal baselines
                  if prop_col and prop_col in zip_rows.columns:
                      sf_rows = zip_rows[zip_rows[prop_col].astype(str).str.contains('Single Family|All Residential', case=False, na=False)]
                      if not sf_rows.empty:
                          zip_rows = sf_rows
                  
                  # Grab the single newest reporting week for this ZIP
                  newest_row = zip_rows.sort_values(by=date_col, ascending=False).iloc[0]
                  
                  if pd.notnull(newest_row[price_col]) and pd.notnull(newest_row[ppsf_col]):
                      med_price = int(newest_row[price_col])
                      ppsqft = int(newest_row[ppsf_col])

                      output["zips"][str(zip_code)] = {
                          "medianPrice": med_price,
                          "avgPpsqft": ppsqft,
                          "marginalRate": int(ppsqft * 0.42), # 42% Appraisal Rule
                          "dataPeriodEnd": str(newest_row[date_col])
                      }

              with open("eastside_markets.json", "w") as f:
                  json.dump(output, f, indent=2)
              
              print(f"✅ Generated eastside_markets.json successfully! Populated {len(output['zips'])} Puget Sound ZIP codes.")

          except Exception as e:
              print(f"❌ Fatal Python Error: {e}")
              sys.exit(1)
          EOF

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'bot@github.com'
          git add eastside_markets.json
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected in market data. Skipping push."
          else
            git commit -m "Auto-update Eastside MLS market data"
            git push
            echo "✅ Successfully pushed updated regional JSON to repository!"
          fi
