name: Update Eastside MLS Data
on:
  schedule:
    - cron: '0 14 * * 1' # Runs every Monday at 7 AM PDT
  workflow_dispatch:     # Allows manual trigger button in GitHub UI

permissions:
  contents: write        # REQUIRED: Gives the bot permission to push the JSON back to your repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas requests

      - name: Fetch and Filter Data (Ultra Fast)
        run: |
          echo "Downloading Redfin dataset..."
          curl -sSL https://redfin-public-data.s3.us-west-2.amazonaws.com/redfin_market_tracker/zip_code_market_tracker.tsv000.gz -o raw.tsv.gz

          echo "Filtering down to Eastside ZIP codes..."
          zcat raw.tsv.gz | awk 'NR==1 || /98028|98072|98012|98034|98033|98052|98021/' > filtered.tsv || true
          
          rm raw.tsv.gz
          echo "✅ Filtered successfully! Total matching rows captured:"
          wc -l filtered.tsv

      - name: Generate JSON
        run: |
          python - << 'EOF'
          import pandas as pd
          import json, datetime, sys

          try:
              df = pd.read_csv('filtered.tsv', sep='\t', low_memory=False, on_bad_lines='skip')
              if df.empty:
                  print("❌ Error: filtered.tsv is empty.")
                  sys.exit(1)

              print("ℹ️ Found file headers:", df.columns.tolist()[:8])

              # 1. BULLETPROOF COLUMN LOCATOR (Ignores REGION_TYPE and REGION_TYPE_ID)
              col_name = None
              for c in df.columns:
                  if str(c).upper() in ['REGION', 'REGION_NAME', 'ZIP', 'ZIP_CODE', 'REGION_ID']:
                      col_name = c
                      break
              if not col_name:
                  for c in df.columns:
                      c_up = str(c).upper()
                      if ('REGION' in c_up or 'ZIP' in c_up) and ('TYPE' not in c_up and '_ID' not in c_up):
                          col_name = c
                          break
              
              if not col_name:
                  raise KeyError(f"Could not locate region column in headers: {df.columns.tolist()}")

              # Extract exact 5-digit ZIP code pattern
              df['clean_zip'] = df[col_name].astype(str).str.extract(r'(\d{5})')[0]
              
              print(f"ℹ️ Selected Region Column: '{col_name}' | Extracted ZIPs: {df['clean_zip'].dropna().unique().tolist()}")

              # 2. Filter strictly for target ZIP codes
              target_zips = ['98028', '98072', '98012', '98034', '98033', '98052', '98021']
              eastside = df[df['clean_zip'].isin(target_zips)].copy()

              if eastside.empty:
                  print("❌ No target ZIPs matched after cleaning! Check extraction logs above.")
                  sys.exit(1)

              # 3. Dynamically locate Property Type, Date, Price, and PPSF columns
              prop_col = next((c for c in df.columns if str(c).upper() in ['PROPERTY_TYPE', 'PROP_TYPE', 'HOME_TYPE']), None)
              if prop_col and prop_col in eastside.columns:
                  prop_filter = eastside[prop_col].astype(str).str.contains('Single Family|All Residential|All Home', case=False, na=False)
                  if prop_filter.any():
                      eastside = eastside[prop_filter]

              date_col = next((c for c in df.columns if str(c).upper() in ['PERIOD_END', 'DATE', 'END_DATE']), 'PERIOD_END')
              price_col = next((c for c in df.columns if str(c).upper() in ['MEDIAN_SALE_PRICE', 'MEDIAN_PRICE', 'PRICE']), 'MEDIAN_SALE_PRICE')
              ppsf_col = next((c for c in df.columns if str(c).upper() in ['MEDIAN_PPSF', 'PPSF', 'PRICE_PER_SQFT']), 'MEDIAN_PPSF')

              print(f"ℹ️ Mapped Data Columns -> Date: '{date_col}' | Price: '{price_col}' | PPSF: '{ppsf_col}'")

              # 4. GRAB NEWEST DATA PER ZIP: Sort descending by date, then keep the #1 newest entry per ZIP
              eastside = eastside.sort_values(by=date_col, ascending=False)
              latest_per_zip = eastside.drop_duplicates(subset=['clean_zip']).copy()

              output = { "last_updated": str(datetime.date.today()), "zips": {} }
              
              for _, row in latest_per_zip.iterrows():
                  zip_code = str(row['clean_zip'])
                  med_price = int(row[price_col]) if pd.notnull(row[price_col]) else 1400000
                  ppsqft = int(row[ppsf_col]) if pd.notnull(row[ppsf_col]) else 500

                  output["zips"][zip_code] = {
                      "medianPrice": med_price,
                      "avgPpsqft": ppsqft,
                      "marginalRate": int(ppsqft * 0.42),
                      "dataPeriodEnd": str(row[date_col])
                  }

              with open("eastside_markets.json", "w") as f:
                  json.dump(output, f, indent=2)
              
              print("✅ Generated eastside_markets.json successfully! Populated ZIPs:", list(output["zips"].keys()))

          except Exception as e:
              print(f"❌ Fatal Python Error: {e}")
              sys.exit(1)
          EOF

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'bot@github.com'
          git add eastside_markets.json
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected in market data. Skipping push."
          else
            git commit -m "Auto-update Eastside MLS market data"
            git push
            echo "✅ Successfully pushed updated JSON to repository!"
          fi
